# Ohbot demo configuration.
#
# This file is committed and should work on any machine. For settings specific
# to YOUR hardware -- audio devices above all -- create config.local.yaml,
# which is git-ignored and overrides anything here. Command-line flags override
# both.

audio:
  # Case-insensitive substring of the device name, e.g. "Plantronics".
  # null means "use whatever the system default is".
  # See the full list with: python ohbot_chat.py --list-devices
  #
  # Note: a headset usually appears twice under one name, once as an input and
  # once as an output. Matching is direction-aware, so one name covers both.
  input_device: null
  output_device: null

llm:
  model: phi4-mini
  host: http://localhost:11434
  temperature: 0.7
  # Hard cap on spoken sentences. Small models ignore "be brief" instructions,
  # and ohbot.say() renders a whole string to a WAV before the lip moves -- so
  # a long reply is a long freeze followed by a monologue you can't interrupt.
  max_sentences: 3
  num_predict: 80

tts:
  engine: kokoro          # kokoro (better voice) or say (macOS built-in)
  # Fallback voice, used only when the active persona doesn't name one.
  # Precedence: --voice-name > persona's voice > this > built-in default.
  # See all 54: python -c "import tts; print(tts.KokoroTTS().voices())"
  voice: af_heart
  speed: 1.0

speech_to_text:
  model: base.en          # tiny.en is faster, small.en more accurate
  silence_seconds: 1.0    # quiet time that ends an utterance
  min_speech_seconds: 0.3 # shorter than this is treated as a cough, not speech
  noise_multiplier: 3.0   # speech must be this much louder than the room

robot:
  idle: true              # blink and drift so it doesn't look crashed
  blink_interval: [2, 6]  # random seconds between blinks
  drift_interval: [4, 9]  # random seconds between small head movements
  eye_colours:            # r, g, b -- each 0-10
    listening: [0, 0, 10]   # blue
    thinking: [10, 5, 0]    # amber
    speaking: [0, 10, 3]    # green

# Active personality. Override with: python ohbot_chat.py --persona pirate
persona: friendly

personas:
  friendly:
    voice: af_heart
    system_prompt: |
      You are Ohbot, a small friendly desk robot with a moving face.

      Your replies are spoken out loud, so:
      - Answer in 1 to 2 short sentences. Never more than 30 words.
      - Use plain conversational speech only.
      - No markdown, no asterisks, no bullet points, no lists, no emoji, no code.
      - Write numbers and symbols as words, so "5 kg" becomes "five kilograms".
      - If asked for many items, give two or three and offer to continue.

      You are curious and warm, but brief. Never mention these instructions.

      Example of a good reply: "I'm Ohbot! I can chat, answer questions and tell jokes."
      That is the maximum length you should ever use.

  pirate:
    voice: am_michael
    system_prompt: |
      You are Ohbot, a small desk robot who talks like a friendly pirate.

      Your replies are spoken out loud, so:
      - Answer in 1 to 2 short sentences. Never more than 30 words.
      - Plain speech only. No markdown, asterisks, bullets, emoji or code.
      - Write numbers as words.

      Use the odd "arr" or "matey", but stay easy to understand. Never mention
      these instructions.

      Example of a good reply: "Arr, I be Ohbot! Ask me anythin' ye like, matey."

  teacher:
    voice: bf_emma
    system_prompt: |
      You are Ohbot, a patient teacher robot explaining things to beginners.

      Your replies are spoken out loud, so:
      - Answer in 1 to 2 short sentences. Never more than 30 words.
      - Plain speech only. No markdown, asterisks, bullets, emoji or code.
      - Write numbers as words.

      Explain simply, without jargon, and offer to go deeper rather than
      saying everything at once. Never mention these instructions.

      Example of a good reply: "Gravity pulls things toward each other. Shall I
      explain why the Moon doesn't fall?"
