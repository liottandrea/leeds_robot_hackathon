[project]
name = "ohbot-kit"
version = "1.0.0"
description = "A hackathon kit for building expressive, locally-run Ohbot robot applications"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }

# Runtime dependencies live in requirements.txt, which is the participant path
# and is deliberately kept as a plain pinned file. This block exists so tooling
# can resolve the project, not as a second source of truth.
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.8",
]

[tool.setuptools]
packages = ["ohbot_kit"]

# -- formatting and linting -------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["ohbotData", "models", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting (replaces isort)
    "UP",   # pyupgrade
    "B",    # bugbear: likely bugs
    "SIM",  # simplifications
    "C4",   # comprehensions
]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
# Examples are teaching material: module-level code after imports is the point,
# and `import _bootstrap` must run before the ohbot_kit imports it enables.
"examples/*" = ["E402"]
"tools/*" = ["E402"]
# Re-exports are the whole purpose of the package __init__.
"ohbot_kit/__init__.py" = ["F401"]

# -- typing -----------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
files = ["ohbot_kit"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

# These ship no type stubs. ohbot in particular is a third-party library we
# cannot change, so importing it untyped is a fact of life rather than a gap
# we are choosing to leave.
[[tool.mypy.overrides]]
module = [
    "ohbot.*",
    "sounddevice.*",
    "kokoro_onnx.*",
    "faster_whisper.*",
    "serial.*",
    "cv2.*",
    "yaml.*",
]
ignore_missing_imports = true

# -- tests ------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
# Hardware tests need a physical robot, so they are opt-in:
#     pytest -m hardware
addopts = "-m 'not hardware' --strict-markers"
markers = [
    "hardware: requires a physically connected Ohbot",
]

[tool.coverage.run]
source = ["ohbot_kit"]
omit = [
    # Cannot run without a microphone and the Whisper model.
    "ohbot_kit/voice.py",
]

[tool.coverage.report]
# 65% is roughly what is honestly reachable: the audio, serial and model paths
# need hardware. Raising this should mean testing more behaviour, not adding
# assertions about mocks.
fail_under = 65
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
